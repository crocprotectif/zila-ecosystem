<!DOCTYPE html>
<html>
<head>
<title>ZILA Dashboard</title>
<style>
body {background:#0f172a;color:white;font-family:sans-serif}
.card {padding:20px;background:#1e293b;margin:10px;border-radius:10px}
</style>
</head>
<body>

<h1>ZILA ECOSYSTEM 🚀</h1>

<div class="card">
<h3>Status</h3>
<p id="status">Loading...</p>
</div>

<script>
fetch("http://localhost:8000/user/123")
.then(r=>r.json())
.then(d=>{
document.getElementById("status").innerText = JSON.stringify(d)
})
</script>

</body>
</html>
